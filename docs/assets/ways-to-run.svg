<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="title desc">
  <title id="title">Three ways to run ComputeDeck</title>
  <desc id="desc">1. On your computer, which reaches clusters over SSH, cloud GPU accounts over their HTTPS APIs and SSH machines directly. 2. On your computer, with some sources reached through another machine: a jump host with nothing installed forwards your SSH connection to a cluster on a private network, or a collection machine with ComputeDeck installed runs computedeck collect and reaches any source type with its own keys and network. 3. On an always-on server that collects your sources, viewed from your laptop's browser through an SSH tunnel opened by computedeck connect.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.25; }
    .cd { fill: #ffffff; stroke: #1f2328; stroke-width: 2.5; }
    .rule { stroke: #d0d7de; stroke-dasharray: 4 4; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.5; }
    .head { fill: #57606a; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 17px; font-weight: 600; }
    .b { font-size: 15px; font-weight: 600; }
    .s { font-size: 13px; }
    .m { font-size: 13px; fill: #57606a; }
    .l { font-size: 12px; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .box { fill: #161b22; stroke: #6e7681; }
      .cd { fill: #0d1117; stroke: #e6edf3; }
      .rule { stroke: #30363d; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      text { fill: #e6edf3; }
      .m, .l { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="583" rx="12"/>

  <!-- 1. On your computer, everything reached directly -->
  <text class="h" x="24" y="40">1 · On your computer, every source reached directly</text>
  <rect class="cd" x="24" y="60" width="190" height="104" rx="8"/>
  <text class="b" x="40" y="98">Your computer</text>
  <text class="s" x="40" y="118">ComputeDeck + browser</text>
  <text class="m" x="40" y="138">your keys and SSH config</text>
  <path class="line" d="M214,112 H620 M620,74 V150"/>
  <path class="line" d="M620,74 H680" marker-end="url(#arrow)"/>
  <path class="line" d="M620,112 H680" marker-end="url(#arrow)"/>
  <path class="line" d="M620,150 H680" marker-end="url(#arrow)"/>
  <rect class="box" x="680" y="60" width="256" height="28" rx="6"/>
  <text x="694" y="79"><tspan class="b">Clusters</tspan><tspan class="m"> SSH or kubectl</tspan></text>
  <rect class="box" x="680" y="98" width="256" height="28" rx="6"/>
  <text x="694" y="117"><tspan class="b">Cloud GPU accounts</tspan><tspan class="m"> HTTPS API</tspan></text>
  <rect class="box" x="680" y="136" width="256" height="28" rx="6"/>
  <text x="694" y="155"><tspan class="b">SSH machines</tspan><tspan class="m"> over SSH</tspan></text>

  <line class="rule" x1="24" y1="188" x2="936" y2="188"/>

  <!-- 2. On your computer, some sources through another machine -->
  <text class="h" x="24" y="218">2 · On your computer, some sources through another machine</text>
  <rect class="cd" x="24" y="236" width="190" height="140" rx="8"/>
  <text class="b" x="40" y="292">Your computer</text>
  <text class="s" x="40" y="312">ComputeDeck + browser</text>
  <text class="m" x="40" y="332">your keys and SSH config</text>
  <text class="l" x="250" y="298" text-anchor="middle">SSH</text>
  <path class="line" d="M214,306 H287 V266 H360" marker-end="url(#arrow)"/>
  <path class="line" d="M287,306 V346 H360" marker-end="url(#arrow)"/>
  <rect class="box" x="360" y="236" width="220" height="60" rx="8"/>
  <text class="b" x="376" y="261">Jump host</text>
  <text class="m" x="376" y="280">nothing installed</text>
  <rect class="cd" x="360" y="316" width="220" height="60" rx="8"/>
  <text class="b" x="376" y="341">Collection machine</text>
  <text class="m" x="376" y="360">runs computedeck collect</text>
  <text class="l" x="630" y="258" text-anchor="middle">forwarded</text>
  <path class="line" d="M580,266 H680" marker-end="url(#arrow)"/>
  <text class="l" x="630" y="338" text-anchor="middle">SSH or API</text>
  <path class="line" d="M580,346 H680" marker-end="url(#arrow)"/>
  <rect class="box" x="680" y="236" width="256" height="60" rx="8"/>
  <text class="b" x="696" y="261">Cluster or SSH machine</text>
  <text class="m" x="696" y="280">your SSH session, end to end</text>
  <rect class="box" x="680" y="316" width="256" height="60" rx="8"/>
  <text class="b" x="696" y="341">Any source type</text>
  <text class="m" x="696" y="360">with its own keys and network</text>

  <line class="rule" x1="24" y1="400" x2="936" y2="400"/>

  <!-- 3. On an always-on server, viewed from your laptop -->
  <text class="h" x="24" y="430">3 · On an always-on server, viewed from your laptop</text>
  <rect class="box" x="24" y="448" width="190" height="100" rx="8"/>
  <text class="b" x="40" y="484">Your laptop</text>
  <text class="s" x="40" y="504">browser</text>
  <text class="m" x="40" y="524">computedeck connect</text>
  <text class="l" x="287" y="490" text-anchor="middle">SSH tunnel</text>
  <path class="line" d="M214,498 H360" marker-end="url(#arrow)"/>
  <rect class="cd" x="360" y="448" width="220" height="100" rx="8"/>
  <text class="b" x="376" y="484">Always-on server</text>
  <text class="s" x="376" y="504">ComputeDeck service</text>
  <text class="m" x="376" y="524">keeps collecting</text>
  <path class="line" d="M580,498 H680" marker-end="url(#arrow)"/>
  <rect class="box" x="680" y="448" width="256" height="100" rx="8"/>
  <text class="b" x="696" y="491">Your sources</text>
  <text class="m" x="696" y="511">directly, or through a route</text>
  <text class="m" x="696" y="531">as in 1 and 2</text>

  <text class="l" x="936" y="572" text-anchor="end">Heavy outline: ComputeDeck is installed there</text>
</svg>
