[project]
name = "computedeck"
version = "0.3.0"
description = "Read-only dashboard for your Slurm jobs, GPU allocations and cloud instances"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "keyring>=25,<27",
    "platformdirs>=4,<5",
]

[project.scripts]
computedeck = "computedeck.cli:main"

[project.entry-points."computedeck.plugins"]
# Tools that ship with the core; each starts switched off.
notify = "computedeck.tools.notify:plugin"
chat = "computedeck.tools.chat:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/computedeck"]
# The built web app (scripts/build.sh) is ignored by git but shipped in the wheel.
artifacts = ["src/computedeck/static"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist"]
# uv build makes the wheel from the sdist, so the sdist carries the built web app too.
artifacts = ["src/computedeck/static"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Templates of code for plugin projects; their lines are measured after rendering.
"src/computedeck/scaffold.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["tests"]
